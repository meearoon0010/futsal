<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futsal Attendance</title>
    <!-- PWA Essentials -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a2a6c">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Futsal Attendance">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2d6a4f, #1a2a6c);
            min-height: 100vh;
            padding: 12px;
            color: #333;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .header h1 {
            font-size: 1.5em;
            color: #1a2a6c;
            margin-bottom: 4px;
        }

        .header .venue {
            color: #2d6a4f;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header .date-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 6px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9em;
        }

        .conn-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.7em;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            background: #eee;
            color: #888;
        }

        .conn-badge.live { background: #e8f5e9; color: #2e7d32; }
        .conn-badge.down { background: #ffebee; color: #c62828; }

        .admin-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f0f2f5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .admin-toggle.hidden { display: none; }

        /* Admin Panel */
        .admin-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .admin-panel.active { display: block; }

        .admin-panel h3 {
            text-align: center;
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .admin-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .admin-section:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

        .admin-section h4 {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s;
        }

        .admin-btn:active { transform: scale(0.98); }

        .btn-edit-info { background: #1a2a6c; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-add-player { background: #2d6a4f; color: white; }

        .add-player-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .add-player-form input, .add-player-form select {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            background: #fafafa;
        }

        .add-player-form button {
            padding: 12px 20px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
        }

        .player-manage-list {
            margin-top: 10px;
            max-height: 150px;
            overflow-y: auto;
        }

        .player-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .remove-player-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            font-weight: 700;
        }

        /* Login */
        .login-section {
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-section h2 {
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .login-form select,
        .login-form input {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            background: #fafafa;
        }

        .login-form select:focus,
        .login-form input:focus {
            outline: none;
            border-color: #2d6a4f;
            background: #fff;
        }

        .login-btn {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:active {
            background: #2d6a4f;
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.6;
        }

        .login-message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            display: none;
        }

        .login-message.error { display: block; background: #ffebee; color: #c62828; }
        .login-message.success { display: block; background: #e8f5e9; color: #2e7d32; }

        /* User Panel */
        .user-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
            text-align: center;
        }

        .user-panel.active { display: block; }

        .welcome-text {
            font-size: 1.2em;
            color: #1a2a6c;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 700;
        }

        .team-a-badge { background: #ffebee; color: #c62828; }
        .team-b-badge { background: #e3f2fd; color: #1565c0; }
        .admin-badge { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

        .question-text {
            margin-bottom: 15px;
            color: #555;
            font-size: 0.95em;
            line-height: 1.4;
        }

        /* Attendance Buttons */
        .attendance-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .action-btn {
            padding: 18px 10px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .action-btn.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .btn-yes {
            background: white;
            border-color: #28a745;
            color: #28a745;
        }

        .btn-yes.active {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.35);
            transform: translateY(-1px);
        }

        .btn-no {
            background: white;
            border-color: #dc3545;
            color: #dc3545;
        }

        .btn-no.active {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
            transform: translateY(-1px);
        }

        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
        }

        .logout-btn:active { transform: scale(0.98); }

        /* Teams List */
        .teams-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            min-height: 200px;
        }

        @media (min-width: 650px) {
            .teams-container { grid-template-columns: 1fr 1fr; }
        }

        .team-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            min-height: 250px;
        }

        .team-card.team-a { border-top: 5px solid #e74c3c; }
        .team-card.team-b { border-top: 5px solid #3498db; }

        .team-card h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        .list-container {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 300px;
            padding-right: 5px;
        }

        .list-container::-webkit-scrollbar {
            width: 6px;
        }

        .list-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .list-container::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.95em;
            transition: background 0.15s ease;
        }

        .player-item.updated {
            animation: flash 0.6s ease;
        }

        @keyframes flash {
            0% { background: #e8f0fe; }
            100% { background: #f8f9fa; }
        }

        .status-badge {
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .st-pending { background: #fff3cd; color: #856404; }
        .st-yes { background: #d4edda; color: #155724; }
        .st-no { background: #f8d7da; color: #721c24; }
        .st-you { background: #cce5ff; color: #004085; font-weight: 700; }

        /* Summary */
        .summary-section {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-top: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box { min-width: 70px; }

        .stat-num {
            font-size: 2em;
            font-weight: 800;
            color: #2d6a4f;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .stat-label {
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <span class="conn-badge" id="connBadge">● connecting</span>
            <button class="admin-toggle hidden" id="adminToggle" onclick="toggleAdminPanel()">⚙️</button>
            <h1>⚽ Futsal Attendance</h1>
            <p class="venue" id="displayVenue">Khelkunja Arena</p>
            <span class="date-badge" id="displayTime">📅 This Saturday @ 9:00 AM</span>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3>👑 Admin Controls</h3>

            <div class="admin-section">
                <h4>Event Details</h4>
                <div class="admin-actions">
                    <button class="admin-btn btn-edit-info" onclick="openEditModal()">📝 Edit Venue & Time</button>
                </div>
            </div>

            <div class="admin-section">
                <h4>Manage Players</h4>
                <div class="add-player-form">
                    <input type="text" id="newPlayerName" placeholder="Player Name">
                    <select id="newPlayerTeam">
                        <option value="A">Team A</option>
                        <option value="B">Team B</option>
                    </select>
                    <button onclick="addPlayer()">➕ Add</button>
                </div>
                <div class="player-manage-list" id="manageList"></div>
            </div>

            <div class="admin-section">
                <h4>Danger Zone</h4>
                <div class="admin-actions">
                    <button class="admin-btn btn-reset" onclick="resetData()">🔄 Reset All Attendance</button>
                </div>
            </div>
        </div>

        <!-- Login -->
        <div class="login-section" id="loginSection">
            <h2>🔐 Player Login</h2>
            <div class="login-form">
                <select id="playerSelect">
                    <option value="">-- Select Your Name --</option>
                    <optgroup label="🔴 Team A" id="optTeamA"></optgroup>
                    <optgroup label="🔵 Team B" id="optTeamB"></optgroup>
                </select>
                <input type="password" id="passwordInput" placeholder="Enter Password" autocomplete="off">
                <button class="login-btn" id="loginBtn">Login</button>
            </div>
            <div class="login-message" id="loginMsg"></div>
        </div>

        <!-- Dashboard -->
        <div class="user-panel" id="userPanel">
            <div class="welcome-text" id="welcomeText"></div>
            <div class="badges">
                <span class="badge" id="teamBadge"></span>
                <span class="badge admin-badge hidden" id="adminBadge">👑 Admin</span>
            </div>
            <p class="question-text">Are you playing this session?</p>
            <div class="attendance-actions">
                <div class="action-btn btn-yes" id="btnYes">✅ PLAYING</div>
                <div class="action-btn btn-no" id="btnNo">❌ ABSENT</div>
            </div>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <!-- Teams List -->
        <div class="teams-container">
            <div class="team-card team-a">
                <h3>🔴 Team A</h3>
                <div class="list-container">
                  <div id="listA"></div>
                </div>
            </div>
            <div class="team-card team-b">
                <h3>🔵 Team B</h3>
                <div class="list-container">
                  <div id="listB"></div>
                </div>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary-section">
            <h2>📊 Stats</h2>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-num" id="countYes">0</div><div class="stat-label">Playing</div></div>
                <div class="stat-box"><div class="stat-num" id="countNo">0</div><div class="stat-label">Absent</div></div>
                <div class="stat-box"><div class="stat-num" id="countPending">0</div><div class="stat-label">Pending</div></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px;">
            <h3>📝 Edit Event Details</h3>
            <input type="text" id="editVenue" placeholder="Venue Name" style="width:100%;padding:14px;border:2px solid #eee;border-radius:10px;margin-bottom:10px;background:#fafafa;">
            <input type="text" id="editTime" placeholder="Time (e.g., Saturday 9 AM)" style="width:100%;padding:14px;border:2px solid #eee;border-radius:10px;margin-bottom:10px;background:#fafafa;">
            <div style="display:flex;gap:10px;margin-top:5px;">
                <button onclick="closeEditModal()" style="flex:1;padding:14px;border:none;border-radius:10px;background:#e9ecef;color:#333;">Cancel</button>
                <button onclick="saveSettings()" style="flex:1;padding:14px;border:none;border-radius:10px;background:#2d6a4f;color:white;">Save</button>
            </div>
        </div>
    </div>

    <!-- Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

    <script>
        // =========================================================
        // SUPABASE CONFIG — fill these in from your Supabase project
        // (Project Settings > Data API / API keys). The anon key is
        // safe to expose in client code; it has no power on its own
        // beyond what the RLS policies + RPC functions in
        // supabase_schema.sql allow.
        // =========================================================
        const SUPABASE_URL = 'https://lnikyfsqoylfgwsvegsq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuaWt5ZnNxb3lsZmd3c3ZlZ3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzMzNTgsImV4cCI6MjEwNDU0OTM1OH0.Y8ChN4jNtD4Vat20xZ6AKNTRqz4rbh55pv3gps_QrYA';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- STATE (in-memory cache, kept in sync via fetch + realtime) ---
        let roster = { teamA: [], teamB: [] };      // [{name, team, is_admin}]
        let attendanceData = {};                     // { name: 'yes'|'no'|'pending' }
        let currentUser = null;                       // { token, name, team, is_admin }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', async () => {
            setupListeners();
            restoreSession();
            await Promise.all([fetchRoster(), fetchAttendance(), fetchSettings()]);
            renderAll();
            setupRealtime();
        });

        function setupListeners() {
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doLogin();
            });
            document.getElementById('btnYes').addEventListener('click', () => setAttendance('yes'));
            document.getElementById('btnNo').addEventListener('click', () => setAttendance('no'));
            document.getElementById('logoutBtn').addEventListener('click', doLogout);
        }

        // --- SESSION ---
        function restoreSession() {
            try {
                const saved = sessionStorage.getItem('futsal_user');
                if (saved) currentUser = JSON.parse(saved);
            } catch (e) { currentUser = null; }
        }

        function saveSession() {
            if (currentUser) sessionStorage.setItem('futsal_user', JSON.stringify(currentUser));
            else sessionStorage.removeItem('futsal_user');
        }

        // --- REALTIME ---
        function setupRealtime() {
            const setBadge = (state) => {
                const el = document.getElementById('connBadge');
                el.className = 'conn-badge ' + state;
                el.textContent = state === 'live' ? '● live' : (state === 'down' ? '● offline' : '● connecting');
            };

            supabase
                .channel('public:attendance')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'attendance' }, (payload) => {
                    const row = payload.new && Object.keys(payload.new).length ? payload.new : payload.old;
                    if (!row) return;
                    if (payload.eventType === 'DELETE') delete attendanceData[row.player_name];
                    else attendanceData[row.player_name] = row.status;
                    renderLists();
                    renderStats();
                    renderMyAttendanceButtons();
                    flashPlayer(row.player_name);
                })
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') setBadge('live');
                    else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setBadge('down');
                });

            supabase
                .channel('public:roster_public')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'roster_public' }, async () => {
                    await fetchRoster();
                    renderAll();
                })
                .subscribe();

            supabase
                .channel('public:settings')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, (payload) => {
                    applySettings(payload.new);
                })
                .subscribe();
        }

        function flashPlayer(name) {
            const rows = document.querySelectorAll('.player-item');
            for (const row of rows) {
                if (row.dataset.name === name) {
                    row.classList.add('updated');
                    setTimeout(() => row.classList.remove('updated'), 600);
                    break;
                }
            }
        }

        // --- DATA FETCH ---
        async function fetchRoster() {
            const { data, error } = await supabase
                .from('roster_public')
                .select('name, team, is_admin')
                .order('created_at', { ascending: true });
            if (error) { console.error(error); return; }
            roster = {
                teamA: data.filter(p => p.team === 'A'),
                teamB: data.filter(p => p.team === 'B')
            };
        }

        async function fetchAttendance() {
            const { data, error } = await supabase.from('attendance').select('player_name, status');
            if (error) { console.error(error); return; }
            attendanceData = {};
            data.forEach(row => { attendanceData[row.player_name] = row.status; });
        }

        async function fetchSettings() {
            const { data, error } = await supabase.from('settings').select('venue, event_time').eq('id', 1).single();
            if (error) { console.error(error); return; }
            applySettings(data);
        }

        function applySettings(s) {
            if (!s) return;
            document.getElementById('displayVenue').textContent = s.venue;
            document.getElementById('displayTime').textContent = '📅 ' + s.event_time;
        }

        // --- HELPERS ---
        function getAllPlayers() { return [...roster.teamA, ...roster.teamB]; }
        function isTeamA(name) { return roster.teamA.some(p => p.name === name); }

        function openEditModal() {
            const venueEl = document.getElementById('displayVenue');
            const timeEl = document.getElementById('displayTime');
            document.getElementById('editVenue').value = venueEl.textContent.trim();
            document.getElementById('editTime').value = timeEl.textContent.replace('📅', '').trim();
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        async function saveSettings() {
            if (!currentUser) return;
            const v = document.getElementById('editVenue').value.trim();
            const t = document.getElementById('editTime').value.trim();
            const { error } = await supabase.rpc('rpc_update_settings', {
                p_token: currentUser.token, p_venue: v, p_time: t
            });
            if (error) return alert(error.message);
            closeEditModal();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const isVisible = panel.classList.contains('active');
            if (!isVisible) renderManageList();
            panel.classList.toggle('active');
        }

        // --- PLAYER MANAGEMENT (ADMIN) ---
        async function addPlayer() {
            const nameInput = document.getElementById('newPlayerName');
            const teamSelect = document.getElementById('newPlayerTeam');
            const name = nameInput.value.trim();
            if (!name) return alert('Enter a player name');
            if (!currentUser) return;

            const { error } = await supabase.rpc('rpc_add_player', {
                p_token: currentUser.token, p_name: name, p_team: teamSelect.value
            });
            if (error) return alert(error.message);

            nameInput.value = '';
            await fetchRoster();
            renderAll();
            renderManageList();
        }

        async function removePlayer(name) {
            if (!confirm('Remove ' + name + '?')) return;
            if (!currentUser) return;

            const { error } = await supabase.rpc('rpc_remove_player', {
                p_token: currentUser.token, p_name: name
            });
            if (error) return alert(error.message);

            await Promise.all([fetchRoster(), fetchAttendance()]);
            renderAll();
            renderManageList();
        }

        function renderManageList() {
            const container = document.getElementById('manageList');
            let html = '';

            const renderTeam = (team, label) => {
                html += `<div style="font-size:0.8em; color:#888; margin-top:8px; margin-bottom:4px;">${label}</div>`;
                team.forEach(p => {
                    const isAdmin = p.is_admin === true;
                    html += `<div class="player-manage-item">
                        <span>${p.name}${isAdmin ? ' 👑' : ''}</span>
                        ${isAdmin ? '<span style="font-size:0.8em; color:#888;">Admin</span>' :
                        `<button class="remove-player-btn" onclick="removePlayer('${p.name}')">Remove</button>`}
                    </div>`;
                });
            };

            renderTeam(roster.teamA, '🔴 Team A');
            renderTeam(roster.teamB, '🔵 Team B');

            container.innerHTML = html;
        }

        // --- AUTH ---
        async function doLogin() {
            const name = document.getElementById('playerSelect').value;
            const pass = document.getElementById('passwordInput').value.trim();
            const msg = document.getElementById('loginMsg');
            const btn = document.getElementById('loginBtn');

            if (!name) return showMsg(msg, 'Please select your name', 'error');
            if (!pass) return showMsg(msg, 'Please enter password', 'error');

            btn.disabled = true;
            const { data, error } = await supabase.rpc('rpc_login', { p_name: name, p_password: pass });
            btn.disabled = false;

            if (error || !data || !data.length) {
                return showMsg(msg, 'Incorrect name or password', 'error');
            }

            const row = data[0];
            currentUser = { token: row.token, name: row.name, team: row.team, is_admin: row.is_admin };
            saveSession();

            document.getElementById('passwordInput').value = '';
            showMsg(msg, 'Welcome, ' + row.name + '!', 'success');
            msg.style.display = 'none';

            renderAll();
        }

        async function doLogout() {
            if (currentUser) {
                await supabase.rpc('rpc_logout', { p_token: currentUser.token }).catch(() => {});
            }
            currentUser = null;
            saveSession();
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggle').classList.add('hidden');
            renderAll();
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'login-message ' + type;
        }

        // --- ATTENDANCE ---
        async function setAttendance(status) {
            if (!currentUser) return;

            // optimistic update
            attendanceData[currentUser.name] = status;
            document.getElementById('btnYes').classList.toggle('active', status === 'yes');
            document.getElementById('btnNo').classList.toggle('active', status === 'no');
            renderLists();
            renderStats();

            const { error } = await supabase.rpc('rpc_set_attendance', {
                p_token: currentUser.token, p_status: status
            });

            if (error) {
                if (error.message && error.message.includes('Session expired')) {
                    alert('Your session expired, please log in again.');
                    return doLogout();
                }
                alert(error.message);
            }
        }

        async function resetData() {
            if (!currentUser) return;
            if (!confirm('Are you sure? This will clear ALL attendance data.')) return;

            const { error } = await supabase.rpc('rpc_reset_attendance', { p_token: currentUser.token });
            if (error) return alert(error.message);

            document.getElementById('adminPanel').classList.remove('active');
        }

        // --- RENDER ---
        function renderAll() {
            renderLoginDropdown();
            renderDashboard();
            renderLists();
            renderStats();
        }

        function renderLoginDropdown() {
            const optA = document.getElementById('optTeamA');
            const optB = document.getElementById('optTeamB');

            optA.innerHTML = '';
            optB.innerHTML = '';

            roster.teamA.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name + (p.is_admin ? ' 👑' : '');
                optA.appendChild(opt);
            });
            roster.teamB.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name;
                optB.appendChild(opt);
            });
        }

        function renderMyAttendanceButtons() {
            if (!currentUser) return;
            const status = attendanceData[currentUser.name];
            document.getElementById('btnYes').classList.toggle('active', status === 'yes');
            document.getElementById('btnNo').classList.toggle('active', status === 'no');
        }

        function renderDashboard() {
            const loginSec = document.getElementById('loginSection');
            const userPan = document.getElementById('userPanel');
            const adminToggle = document.getElementById('adminToggle');
            const adminPanel = document.getElementById('adminPanel');

            if (currentUser) {
                loginSec.style.display = 'none';
                userPan.classList.add('active');

                document.getElementById('welcomeText').textContent = 'Hi, ' + currentUser.name;

                const tBadge = document.getElementById('teamBadge');
                const isA = isTeamA(currentUser.name);
                tBadge.textContent = isA ? '🔴 Team A' : '🔵 Team B';
                tBadge.className = 'badge ' + (isA ? 'team-a-badge' : 'team-b-badge');

                document.getElementById('adminBadge').classList.toggle('hidden', !currentUser.is_admin);
                adminToggle.classList.toggle('hidden', !currentUser.is_admin);

                renderMyAttendanceButtons();

            } else {
                loginSec.style.display = 'block';
                userPan.classList.remove('active');
                adminToggle.classList.add('hidden');
                adminPanel.classList.remove('active');
            }
        }

        function renderLists() {
            renderList('listA', roster.teamA);
            renderList('listB', roster.teamB);
        }

        function renderList(id, team) {
            const container = document.getElementById(id);
            let html = '';
            team.forEach(p => {
                const s = attendanceData[p.name];
                let badge = '<span class="status-badge st-pending">Pending</span>';
                if (s === 'yes') badge = '<span class="status-badge st-yes">Playing</span>';
                if (s === 'no') badge = '<span class="status-badge st-no">Absent</span>';
                if (currentUser && currentUser.name === p.name) {
                    badge = '<span class="status-badge st-you">You</span>';
                }
                const crown = p.is_admin ? ' 👑' : '';
                html += `<div class="player-item" data-name="${p.name}">
                            <span>${p.name}${crown}</span>
                            ${badge}
                         </div>`;
            });
            container.innerHTML = html;
        }

        function renderStats() {
            const all = getAllPlayers();
            let y = 0, n = 0, p = 0;
            all.forEach(pl => {
                const s = attendanceData[pl.name];
                if (s === 'yes') y++;
                else if (s === 'no') n++;
                else p++;
            });
            document.getElementById('countYes').textContent = y;
            document.getElementById('countNo').textContent = n;
            document.getElementById('countPending').textContent = p;
        }
    </script>
</body>
</html>
