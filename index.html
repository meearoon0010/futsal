<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futsal Attendance App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/index.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-center mb-8 text-blue-600">Futsal Attendance App</h1>
        
        <div id="auth-container" class="max-w-md mx-auto mb-8 hidden">
            <button id="sign-in-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                Sign in with Google
            </button>
        </div>
        
        <div id="main-container" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="user-name" class="text-xl font-semibold"></h2>
                <button id="sign-out-btn" class="text-sm text-red-600 hover:text-red-800">Sign Out</button>
            </div>
            
            <div id="attendance-section" class="mb-8 p-4 bg-white rounded-lg shadow">
                <h3 class="text-lg font-medium mb-2">Attendance for Futsal on <span id="current-date"></span></h3>
                <div class="flex space-x-4">
                    <button id="yes-btn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded">
                        YES
                    </button>
                    <button id="no-btn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded">
                        NO
                    </button>
                </div>
                <p id="attendance-status" class="mt-2 text-center"></p>
            </div>
            
            <div id="admin-section" class="hidden">
                <div class="bg-white p-4 rounded-lg shadow mb-6">
                    <h3 class="text-lg font-medium mb-3">Admin Controls</h3>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="venue">
                            Venue
                        </label>
                        <div class="flex">
                            <input id="venue" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text">
                            <button id="update-venue-btn" class="ml-2 bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded text-sm">
                                Update
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="time">
                            Time
                        </label>
                        <div class="flex">
                            <input id="time" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text">
                            <button id="update-time-btn" class="ml-2 bg-blue-500 hover:bg-blue-600 text-white font-bold py-1 px-3 rounded text-sm">
                                Update
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">
                            Manage Players
                        </label>
                        <div class="flex mb-2">
                            <input id="new-player" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="Player name">
                            <select id="team-select" class="ml-2 shadow border rounded py-2 px-3 text-gray-700 focus:outline-none focus:shadow-outline">
                                <option value="A">Team A</option>
                                <option value="B">Team B</option>
                            </select>
                            <button id="add-player-btn" class="ml-2 bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-3 rounded text-sm">
                                Add
                            </button>
                        </div>
                    </div>
                    
                    <button id="generate-pdf-btn" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded">
                        Generate PDF of YES responses
                    </button>
                </div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div id="yes-players" class="bg-white p-4 rounded-lg shadow">
                    <h3 class="text-lg font-medium mb-2">Players Coming (YES)</h3>
                    <ul id="yes-list" class="list-disc pl-5"></ul>
                </div>
                
                <div id="no-players" class="bg-white p-4 rounded-lg shadow">
                    <h3 class="text-lg font-medium mb-2">Players Not Coming (NO)</h3>
                    <ul id="no-list" class="list-disc pl-5"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://lnikyfsqoylfgwsvegsq.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuaWt5ZnNxb3lsZmd3c3ZlZ3NxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NzMzNTgsImV4cCI6MjEwNDU0OTM1OH0.Y8ChN4jNtD4Vat20xZ6AKNTRqz4rbh55pv3gps_QrYA';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        // DOM elements
        const authContainer = document.getElementById('auth-container');
        const mainContainer = document.getElementById('main-container');
        const userNameElement = document.getElementById('user-name');
        const signInBtn = document.getElementById('sign-in-btn');
        const signOutBtn = document.getElementById('sign-out-btn');
        const yesBtn = document.getElementById('yes-btn');
        const noBtn = document.getElementById('no-btn');
        const attendanceStatus = document.getElementById('attendance-status');
        const currentDate = document.getElementById('current-date');
        const venueInput = document.getElementById('venue');
        const timeInput = document.getElementById('time');
        const updateVenueBtn = document.getElementById('update-venue-btn');
        const updateTimeBtn = document.getElementById('update-time-btn');
        const newPlayerInput = document.getElementById('new-player');
        const teamSelect = document.getElementById('team-select');
        const addPlayerBtn = document.getElementById('add-player-btn');
        const generatePdfBtn = document.getElementById('generate-pdf-btn');
        const adminSection = document.getElementById('admin-section');
        const yesList = document.getElementById('yes-list');
        const noList = document.getElementById('no-list');
        
        // Get today's date in YYYY-MM-DD format
        function getTodayDate() {
            const today = new Date();
            return today.toISOString().split('T')[0];
        }
        
        // Format date for display
        function formatDate(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString(undefined, options);
        }
        
        // Initialize the app
        async function initializeApp() {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (user) {
                authContainer.classList.add('hidden');
                mainContainer.classList.remove('hidden');
                userNameElement.textContent = `Welcome, ${user.user_metadata.name}`;
                
                // Check if user is admin
                if (user.email === "whitewalkerofnorth@gmail.com") {
                    adminSection.classList.remove('hidden');
                    loadAdminData();
                }
                
                loadAttendanceStatus();
                loadVenueAndTime();
                loadPlayers();
            } else {
                authContainer.classList.remove('hidden');
                mainContainer.classList.add('hidden');
            }
        }
        
        // Load admin data
        async function loadAdminData() {
            // Venue and time are stored in a separate table
            const { data, error } = await supabase
                .from('settings')
                .select('*')
                .single();
                
            if (error) {
                console.error('Error loading settings:', error);
                return;
            }
            
            venueInput.value = data.venue;
            timeInput.value = data.time;
        }
        
        // Load user attendance status
        async function loadAttendanceStatus() {
            const { data: { user } } = await supabase.auth.getUser();
            
            const { data, error } = await supabase
                .from('attendance')
                .select('*')
                .eq('user_id', user.id)
                .eq('date', getTodayDate())
                .single();
                
            if (error) {
                attendanceStatus.textContent = "Have you confirmed your attendance?";
                attendanceStatus.className = "mt-2 text-center text-gray-600";
                return;
            }
            
            attendanceStatus.textContent = `You have confirmed: ${data.response.toUpperCase()}`;
            attendanceStatus.className = `mt-2 text-center ${data.response === 'yes' ? 'text-green-600' : 'text-red-600'}`;
        }
        
        // Load venue and time
        async function loadVenueAndTime() {
            const { data, error } = await supabase
                .from('settings')
                .select('*')
                .single();
                
            if (error) {
                currentDate.innerHTML = formatDate(getTodayDate());
                return;
            }
            
            currentDate.innerHTML = `${formatDate(getTodayDate())} | ${data.venue} | ${data.time}`;
        }
        
        // Load players
        async function loadPlayers() {
            const { data, error } = await supabase
                .from('attendance')
                .select('*')
                .eq('date', getTodayDate());
                
            if (error) {
                console.error('Error loading players:', error);
                return;
            }
            
            yesList.innerHTML = '';
            noList.innerHTML = '';
            
            data.forEach(record => {
                const { name, response, team } = record;
                
                const li = document.createElement('li');
                li.className = 'py-1';
                
                const teamSpan = document.createElement('span');
                teamSpan.className = `inline-block w-4 h-4 rounded-full mr-2 ${
                    team === 'A' ? 'bg-blue-500' : 'bg-red-500'
                }`;
                
                li.textContent = name;
                li.prepend(teamSpan);
                
                if (response === 'yes') {
                    yesList.appendChild(li);
                } else {
                    noList.appendChild(li);
                }
            });
        }
        
        // Handle sign in with Google
        signInBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
            });
            
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Something went wrong signing in!'
                });
            }
        });
        
        // Handle sign out
        signOutBtn.addEventListener('click', async () => {
            const { error } = await supabase.auth.signOut();
            
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Something went wrong signing out!'
                });
            } else {
                initializeApp();
            }
        });
        
        // Handle YES response
        yesBtn.addEventListener('click', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (!user) return;
            
            const today = getTodayDate();
            
            // Check if record exists
            const { data, error: checkError } = await supabase
                .from('attendance')
                .select('*')
                .eq('user_id', user.id)
                .eq('date', today)
                .single();
                
            if (!checkError) {
                // Update existing record
                const { error } = await supabase
                    .from('attendance')
                    .update({ response: 'yes' })
                    .eq('id', data.id);
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong updating your attendance!'
                    });
                }
            } else {
                // Create new record
                const { error } = await supabase
                    .from('attendance')
                    .insert({
                        user_id: user.id,
                        name: user.user_metadata.name,
                        response: 'yes',
                        team: 'A', // Default team
                        date: today
                    });
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong recording your attendance!'
                    });
                }
            }
            
            loadAttendanceStatus();
            loadPlayers();
        });
        
        // Handle NO response
        noBtn.addEventListener('click', async () => {
            const { data: { user } } = await supabase.auth.getUser();
            
            if (!user) return;
            
            const today = getTodayDate();
            
            // Check if record exists
            const { data, error: checkError } = await supabase
                .from('attendance')
                .select('*')
                .eq('user_id', user.id)
                .eq('date', today)
                .single();
                
            if (!checkError) {
                // Update existing record
                const { error } = await supabase
                    .from('attendance')
                    .update({ response: 'no' })
                    .eq('id', data.id);
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong updating your attendance!'
                    });
                }
            } else {
                // Create new record
                const { error } = await supabase
                    .from('attendance')
                    .insert({
                        user_id: user.id,
                        name: user.user_metadata.name,
                        response: 'no',
                        team: 'A', // Default team
                        date: today
                    });
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong recording your attendance!'
                    });
                }
            }
            
            loadAttendanceStatus();
            loadPlayers();
        });
        
        // Handle venue update
        updateVenueBtn.addEventListener('click', async () => {
            const newVenue = venueInput.value;
            
            const { error } = await supabase
                .from('settings')
                .update({ venue: newVenue })
                .eq('id', 1);
                
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Something went wrong updating the venue!'
                });
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'Venue Updated!',
                    showConfirmButton: false,
                    timer: 1500
                });
                loadVenueAndTime();
            }
        });
        
        // Handle time update
        updateTimeBtn.addEventListener('click', async () => {
            const newTime = timeInput.value;
            
            const { error } = await supabase
                .from('settings')
                .update({ time: newTime })
                .eq('id', 1);
                
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Something went wrong updating the time!'
                });
            } else {
                Swal.fire({
                    icon: 'success',
                    title: 'Time Updated!',
                    showConfirmButton: false,
                    timer: 1500
                });
                loadVenueAndTime();
            }
        });
        
        // Handle adding a new player
        addPlayerBtn.addEventListener('click', async () => {
            const playerName = newPlayerInput.value.trim();
            const team = teamSelect.value;
            
            if (!playerName) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Empty Name',
                    text: 'Please enter a player name!'
                });
                return;
            }
            
            const today = getTodayDate();
            
            // Check if this player already exists for today
            const { data, error: checkError } = await supabase
                .from('attendance')
                .select('*')
                .eq('name', playerName)
                .eq('date', today)
                .single();
                
            if (!checkError) {
                // Player already exists, update their team
                const { error } = await supabase
                    .from('attendance')
                    .update({ team })
                    .eq('id', data.id);
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong updating the player team!'
                    });
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: 'Player team updated!',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }
            } else {
                // Create new player record with YES response
                const { error } = await supabase
                    .from('attendance')
                    .insert({
                        name: playerName,
                        response: 'yes',
                        team,
                        date: today,
                        user_id: 'admin_add' // Mark as admin added
                    });
                    
                if (error) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Something went wrong adding the player!'
                    });
                } else {
                    Swal.fire({
                        icon: 'success',
                        title: 'Player added successfully!',
                        showConfirmButton: false,
                        timer: 1500
                    });
                }
            }
            
            newPlayerInput.value = '';
            loadPlayers();
        });
        
        // Generate PDF of YES responses
        generatePdfBtn.addEventListener('click', async () => {
            const { data, error } = await supabase
                .from('attendance')
                .select('*')
                .eq('response', 'yes')
                .eq('date', getTodayDate());
                
            if (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Something went wrong retrieving attendance data!'
                });
                return;
            }
            
            // Generate PDF
            const doc = new window.jspdf.jsPDF();
            const currentDate = new Date().toLocaleDateString();
            
            doc.setFontSize(18);
            doc.text('Futsal Attendance (YES Responses)', 15, 20);
            doc.setFontSize(12);
            doc.text(`Date: ${currentDate} | Total: ${data.length}`, 15, 30);
            doc.text('===================================', 15, 35);
            
            let y = 45;
            data.forEach((record, index) => {
                doc.text(`${index + 1}. ${record.name} (Team ${record.team})`, 15, y);
                y += 10;
                
                if (y > 270) {  // Start new page if we're near the bottom
                    doc.addPage();
                    y = 20;
                }
            });
            
            doc.save(`futsal_attendance_${currentDate}.pdf`);
        });
        
        // Sign up listener
        supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_IN') {
                initializeApp();
            } else if (event === 'SIGNED_OUT') {
                initializeApp();
            }
        });
        
        // Initialize the app on load
        initializeApp();
    </script>
</body>
</html>
