<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a2a6c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Futsal Attendance">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- PWA icons (optional, create 192x192 and 512x512 images named icon.png and icon-512x512.png) -->
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon.png">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futsal Attendance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #2d6a4f, #1a2a6c);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 12px;
            color: #333;
            -webkit-text-size-adjust: 100%;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* Header */
        .header {
            background: white;
            border-radius: 16px;
            padding: 18px;
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .header h1 {
            font-size: 1.5em;
            color: #1a2a6c;
            margin-bottom: 4px;
        }

        .header .venue {
            color: #2d6a4f;
            font-size: 1.1em;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header .date-badge {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 6px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.9em;
        }

        .admin-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #f0f2f5;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-toggle.hidden { display: none; }

        /* Admin Panel */
        .admin-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .admin-panel.active { display: block; }

        .admin-panel h3 {
            text-align: center;
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .admin-section {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .admin-section:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }

        .admin-section h4 {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .admin-btn {
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
        }

        .btn-edit-info { background: #1a2a6c; color: white; }
        .btn-reset { background: #e74c3c; color: white; }
        .btn-add-player { background: #2d6a4f; color: white; }

        .admin-btn:active { transform: scale(0.98); }

        .add-player-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .add-player-form input {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            background: #fafafa;
        }

        .add-player-form input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .add-player-form select {
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px;
            background: #fafafa;
        }

        .add-player-form button {
            padding: 12px 20px;
            background: #2d6a4f;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9em;
            cursor: pointer;
        }

        .player-manage-list {
            margin-top: 10px;
        }

        .player-manage-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 0.9em;
        }

        .remove-player-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8em;
            cursor: pointer;
            font-weight: 700;
        }

        /* Login */
        .login-section {
            background: white;
            border-radius: 16px;
            padding: 20px 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .login-section h2 {
            color: #1a2a6c;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .login-form select,
        .login-form input {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            background: #fafafa;
        }

        .login-form select:focus,
        .login-form input:focus {
            outline: none;
            border-color: #2d6a4f;
            background: #fff;
        }

        .login-btn {
            width: 100%;
            max-width: 340px;
            padding: 14px;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:active {
            background: #2d6a4f;
            transform: scale(0.98);
        }

        .login-message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
            display: none;
        }

        .login-message.error { display: block; background: #ffebee; color: #c62828; }
        .login-message.success { display: block; background: #e8f5e9; color: #2e7d32; }

        /* User Panel */
        .user-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: none;
            text-align: center;
        }

        .user-panel.active { display: block; }

        .welcome-text {
            font-size: 1.2em;
            color: #1a2a6c;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: 700;
        }

        .team-a-badge { background: #ffebee; color: #c62828; }
        .team-b-badge { background: #e3f2fd; color: #1565c0; }
        .admin-badge { background: #fff3cd; color: #856404; border: 1px solid #ffc107; }

        .question-text {
            margin-bottom: 15px;
            color: #555;
            font-size: 0.95em;
            line-height: 1.4;
        }

        /* Attendance Buttons */
        .attendance-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .action-btn {
            padding: 18px 10px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            user-select: none;
            border: 2px solid transparent;
            transition: all 0.15s ease;
        }

        .btn-yes {
            background: white;
            border-color: #28a745;
            color: #28a745;
        }

        .btn-yes.active {
            background: #28a745;
            color: white;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.35);
            transform: translateY(-1px);
        }

        .btn-no {
            background: white;
            border-color: #dc3545;
            color: #dc3545;
        }

        .btn-no.active {
            background: #dc3545;
            color: white;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.35);
            transform: translateY(-1px);
        }

        .logout-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            cursor: pointer;
        }

        .logout-btn:active { transform: scale(0.98); }

        /* Teams List */
        .teams-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 650px) {
            .teams-container { grid-template-columns: 1fr 1fr; }
        }

        .team-card {
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .team-card.team-a { border-top: 5px solid #e74c3c; }
        .team-card.team-b { border-top: 5px solid #3498db; }

        .team-card h3 {
            text-align: center;
            margin-bottom: 12px;
            font-size: 1.1em;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            margin-bottom: 6px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 0.95em;
            transition: background 0.15s ease;
        }

        .player-item.just-updated {
            animation: flash 0.6s ease;
        }

        @keyframes flash {
            0% { background: #e8f0fe; }
            100% { background: #f8f9fa; }
        }

        .status-badge {
            font-size: 0.75em;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: 700;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .st-pending { background: #fff3cd; color: #856404; }
        .st-yes { background: #d4edda; color: #155724; }
        .st-no { background: #f8d7da; color: #721c24; }
        .st-you { background: #cce5ff; color: #004085; font-weight: 700; }

        /* Summary */
        .summary-section {
            background: white;
            border-radius: 16px;
            padding: 18px;
            margin-top: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .stats-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-box { min-width: 70px; }

        .stat-num {
            font-size: 2em;
            font-weight: 800;
            color: #2d6a4f;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .stat-label {
            font-size: 0.7em;
            color: #666;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .hidden { display: none !important; }

        /* Edit Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal h3 {
            color: #1a2a6c;
            text-align: center;
            margin-bottom: 15px;
        }

        .modal input {
            width: 100%;
            padding: 14px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 10px;
            background: #fafafa;
        }

        .modal input:focus {
            outline: none;
            border-color: #2d6a4f;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 700;
            cursor: pointer;
        }

        .modal-save { background: #2d6a4f; color: white; }
        .modal-cancel { background: #e9ecef; color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <button class="admin-toggle hidden" id="adminToggle" onclick="toggleAdminPanel()">⚙️</button>
            <h1>⚽ Futsal Attendance</h1>
            <p class="venue" id="displayVenue">Khelkunja Arena</p>
            <span class="date-badge" id="displayTime">📅 This Saturday @ 9:00 AM</span>
        </div>

        <!-- Admin Panel -->
        <div class="admin-panel" id="adminPanel">
            <h3>👑 Admin Controls</h3>

            <div class="admin-section">
                <h4>Event Details</h4>
                <div class="admin-actions">
                    <button class="admin-btn btn-edit-info" onclick="openEditModal()">📝 Edit Venue & Time</button>
                </div>
            </div>

            <div class="admin-section">
                <h4>Manage Players</h4>
                <div class="add-player-form">
                    <input type="text" id="newPlayerName" placeholder="Player Name">
                    <select id="newPlayerTeam">
                        <option value="A">Team A</option>
                        <option value="B">Team B</option>
                    </select>
                    <button onclick="addPlayer()">➕ Add</button>
                </div>
                <div class="player-manage-list" id="manageList"></div>
            </div>

            <div class="admin-section">
                <h4>Danger Zone</h4>
                <div class="admin-actions">
                    <button class="admin-btn btn-reset" onclick="resetData()">🔄 Reset All Attendance</button>
                </div>
            </div>
        </div>

        <!-- Login -->
        <div class="login-section" id="loginSection">
            <h2>🔐 Player Login</h2>
            <div class="login-form">
                <select id="playerSelect">
                    <option value="">-- Select Your Name --</option>
                    <optgroup label="🔴 Team A" id="optTeamA"></optgroup>
                    <optgroup label="🔵 Team B" id="optTeamB"></optgroup>
                </select>
                <input type="password" id="passwordInput" placeholder="Enter Password" autocomplete="off">
                <button class="login-btn" id="loginBtn">Login</button>
            </div>
            <div class="login-message" id="loginMsg"></div>
        </div>

        <!-- Dashboard -->
        <div class="user-panel" id="userPanel">
            <div class="welcome-text" id="welcomeText"></div>
            <div class="badges">
                <span class="badge" id="teamBadge"></span>
                <span class="badge admin-badge hidden" id="adminBadge">👑 Admin</span>
            </div>
            <p class="question-text">Are you playing this session?</p>
            <div class="attendance-actions">
                <div class="action-btn btn-yes" id="btnYes">✅ PLAYING</div>
                <div class="action-btn btn-no" id="btnNo">❌ ABSENT</div>
            </div>
            <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
        </div>

        <!-- Teams List -->
        <div class="teams-container">
            <div class="team-card team-a">
                <h3>🔴 Team A</h3>
                <div id="listA"></div>
            </div>
            <div class="team-card team-b">
                <h3>🔵 Team B</h3>
                <div id="listB"></div>
            </div>
        </div>

        <!-- Summary -->
        <div class="summary-section">
            <h2>📊 Stats</h2>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-num" id="countYes">0</div><div class="stat-label">Playing</div></div>
                <div class="stat-box"><div class="stat-num" id="countNo">0</div><div class="stat-label">Absent</div></div>
                <div class="stat-box"><div class="stat-num" id="countPending">0</div><div class="stat-label">Pending</div></div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>📝 Edit Event Details</h3>
            <input type="text" id="editVenue" placeholder="Venue Name">
            <input type="text" id="editTime" placeholder="Time (e.g., Saturday 9 AM)">
            <div class="modal-actions">
                <button class="modal-cancel" onclick="closeEditModal()">Cancel</button>
                <button class="modal-save" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        // --- DATA ---
        const ADMIN_NAME = "Arun";
        const ADMIN_PASS = "admin10";

        const defaultTeamA = [
            { name: "Arun", admin: true },
            { name: "Nishant Sir" }, { name: "Suchit Sir" }, { name: "Sudarshan" },
            { name: "Messi 10" }, { name: "Surendra" }, { name: "Dinesh Sir" }
        ];
        const defaultTeamB = [
            { name: "Bishnu Sir" }, { name: "Bishal" }, { name: "Dinesh" },
            { name: "Abhishek" }, { name: "Roshan" }, { name: "Suman Sir" },
            { name: "Bijay" }, { name: "SP DADA" }
        ];

        let currentUser = null;

        // --- ROSTER MANAGEMENT ---
        function getRoster() {
            try {
                const r = localStorage.getItem('futsal_roster');
                if (r) return JSON.parse(r);
            } catch(e) {}
            return {
                teamA: JSON.parse(JSON.stringify(defaultTeamA)),
                teamB: JSON.parse(JSON.stringify(defaultTeamB))
            };
        }

        function saveRoster(roster) {
            localStorage.setItem('futsal_roster', JSON.stringify(roster));
        }

        function getAllPlayers() {
            const r = getRoster();
            return [...r.teamA, ...r.teamB];
        }

        function findPlayer(name) {
            return getAllPlayers().find(p => p.name === name);
        }

        function isTeamA(name) {
            return getRoster().teamA.some(p => p.name === name);
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            loadSettings();
            checkSession();
            setupListeners();
            renderAll();
        });

        function setupListeners() {
            document.getElementById('loginBtn').addEventListener('click', doLogin);
            document.getElementById('passwordInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') doLogin();
            });
            document.getElementById('btnYes').addEventListener('click', () => setAttendance('yes'));
            document.getElementById('btnNo').addEventListener('click', () => setAttendance('no'));
            document.getElementById('logoutBtn').addEventListener('click', doLogout);
        }

        // --- SETTINGS ---
        function loadSettings() {
            const v = localStorage.getItem('futsal_venue') || 'Khelkunja Arena';
            const t = localStorage.getItem('futsal_time') || 'This Saturday @ 9:00 AM';
            document.getElementById('displayVenue').textContent = v;
            document.getElementById('displayTime').textContent = '📅 ' + t;
        }

        function openEditModal() {
            document.getElementById('editVenue').value = localStorage.getItem('futsal_venue') || 'Khelkunja Arena';
            document.getElementById('editTime').value = localStorage.getItem('futsal_time') || 'This Saturday @ 9:00 AM';
            document.getElementById('editModal').classList.add('active');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveSettings() {
            const v = document.getElementById('editVenue').value.trim();
            const t = document.getElementById('editTime').value.trim();
            if (v) localStorage.setItem('futsal_venue', v);
            if (t) localStorage.setItem('futsal_time', t);
            loadSettings();
            closeEditModal();
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            const isVisible = panel.classList.contains('active');
            if (!isVisible) renderManageList();
            panel.classList.toggle('active');
        }

        // --- PLAYER MANAGEMENT (ADMIN) ---
        function addPlayer() {
            const nameInput = document.getElementById('newPlayerName');
            const teamSelect = document.getElementById('newPlayerTeam');
            const name = nameInput.value.trim();

            if (!name) return alert("Enter a player name");

            const roster = getRoster();
            const allNames = [...roster.teamA, ...roster.teamB].map(p => p.name);
            if (allNames.includes(name)) return alert("Player already exists");

            const team = teamSelect.value;
            const newPlayer = { name: name };
            if (name === ADMIN_NAME) newPlayer.admin = true;

            if (team === 'A') roster.teamA.push(newPlayer);
            else roster.teamB.push(newPlayer);

            saveRoster(roster);
            nameInput.value = '';
            renderAll();
            renderManageList();
        }

        function removePlayer(name) {
            if (name === ADMIN_NAME) return alert("Cannot remove admin");
            if (!confirm("Remove " + name + "?")) return;

            const roster = getRoster();
            roster.teamA = roster.teamA.filter(p => p.name !== name);
            roster.teamB = roster.teamB.filter(p => p.name !== name);
            saveRoster(roster);

            // Clean up attendance data for removed player
            const data = getData();
            delete data[name];
            saveData(data);

            renderAll();
            renderManageList();
        }

        function renderManageList() {
            const roster = getRoster();
            const container = document.getElementById('manageList');
            let html = '';

            const renderTeam = (team, label) => {
                html += `<div style="font-size:0.8em; color:#888; margin-top:8px; margin-bottom:4px;">${label}</div>`;
                team.forEach(p => {
                    const isAdmin = p.admin === true;
                    html += `<div class="player-manage-item">
                        <span>${p.name}${isAdmin ? ' 👑' : ''}</span>
                        ${isAdmin ? '<span style="font-size:0.8em; color:#888;">Admin</span>' :
                        `<button class="remove-player-btn" onclick="removePlayer('${p.name}')">Remove</button>`}
                    </div>`;
                });
            };

            renderTeam(roster.teamA, '🔴 Team A');
            renderTeam(roster.teamB, '🔵 Team B');

            container.innerHTML = html;
        }

        // --- AUTH ---
        function getPass(name) {
            if (name === ADMIN_NAME) return ADMIN_PASS;
            return name.toLowerCase().replace(/\s/g, '');
        }

        function doLogin() {
            const name = document.getElementById('playerSelect').value;
            const pass = document.getElementById('passwordInput').value.trim();
            const msg = document.getElementById('loginMsg');

            if (!name) return showMsg(msg, 'Please select your name', 'error');
            if (!pass) return showMsg(msg, 'Please enter password', 'error');

            const player = findPlayer(name);
            if (!player) return showMsg(msg, 'Player not found', 'error');

            if (pass !== getPass(name)) return showMsg(msg, 'Incorrect password', 'error');

            currentUser = player;
            sessionStorage.setItem('futsal_user', JSON.stringify(player));
            document.getElementById('passwordInput').value = '';
            showMsg(msg, 'Welcome, ' + name + '!', 'success');

            // Instant render, no delay
            msg.style.display = 'none';
            renderAll();
        }

        function doLogout() {
            currentUser = null;
            sessionStorage.removeItem('futsal_user');
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('adminToggle').classList.add('hidden');
            renderAll();
        }

        function checkSession() {
            const saved = sessionStorage.getItem('futsal_user');
            if (saved) {
                currentUser = JSON.parse(saved);
            }
        }

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'login-message ' + type;
        }

        // --- ATTENDANCE ---
        function getData() {
            try { return JSON.parse(localStorage.getItem('futsal_data')) || {}; }
            catch (e) { return {}; }
        }

        function saveData(data) {
            localStorage.setItem('futsal_data', JSON.stringify(data));
        }

        function setAttendance(status) {
            if (!currentUser) return;
            const data = getData();
            data[currentUser.name] = status;
            saveData(data);
            // Instant render, no delay
            renderAll();
        }

        function resetData() {
            if (confirm("Are you sure? This will clear ALL attendance data.")) {
                localStorage.removeItem('futsal_data');
                renderAll();
                document.getElementById('adminPanel').classList.remove('active');
            }
        }

        // --- RENDER ---
        function renderAll() {
            renderLoginDropdown();
            renderDashboard();
            renderLists();
            renderStats();
        }

        function renderLoginDropdown() {
            const roster = getRoster();
            const optA = document.getElementById('optTeamA');
            const optB = document.getElementById('optTeamB');

            optA.innerHTML = '';
            optB.innerHTML = '';

            roster.teamA.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name + (p.admin ? ' 👑' : '');
                optA.appendChild(opt);
            });
            roster.teamB.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name;
                optB.appendChild(opt);
            });
        }

        function renderDashboard() {
            const data = getData();
            const loginSec = document.getElementById('loginSection');
            const userPan = document.getElementById('userPanel');
            const adminToggle = document.getElementById('adminToggle');
            const adminPanel = document.getElementById('adminPanel');

            if (currentUser) {
                loginSec.style.display = 'none';
                userPan.classList.add('active');

                document.getElementById('welcomeText').textContent = 'Hi, ' + currentUser.name;

                const tBadge = document.getElementById('teamBadge');
                const isA = isTeamA(currentUser.name);
                tBadge.textContent = isA ? '🔴 Team A' : '🔵 Team B';
                tBadge.className = 'badge ' + (isA ? 'team-a-badge' : 'team-b-badge');

                const isAdmin = currentUser.name === ADMIN_NAME;
                document.getElementById('adminBadge').classList.toggle('hidden', !isAdmin);
                adminToggle.classList.toggle('hidden', !isAdmin);

                const status = data[currentUser.name];
                document.getElementById('btnYes').classList.toggle('active', status === 'yes');
                document.getElementById('btnNo').classList.toggle('active', status === 'no');

            } else {
                loginSec.style.display = 'block';
                userPan.classList.remove('active');
                adminToggle.classList.add('hidden');
                adminPanel.classList.remove('active');
            }
        }

        function renderLists() {
            const roster = getRoster();
            const data = getData();
            renderList('listA', roster.teamA, data);
            renderList('listB', roster.teamB, data);
        }

        function renderList(id, team, data) {
            const container = document.getElementById(id);
            let html = '';
            team.forEach(p => {
                const s = data[p.name];
                let badge = '<span class="status-badge st-pending">Pending</span>';
                if (s === 'yes') badge = '<span class="status-badge st-yes">Playing</span>';
                if (s === 'no') badge = '<span class="status-badge st-no">Absent</span>';
                if (currentUser && currentUser.name === p.name) {
                    badge = '<span class="status-badge st-you">You</span>';
                }
                const crown = p.admin ? ' 👑' : '';
                html += `<div class="player-item">
                            <span>${p.name}${crown}</span>
                            ${badge}
                         </div>`;
            });
            container.innerHTML = html;
        }

        function renderStats() {
            const data = getData();
            const all = getAllPlayers();
            let y = 0, n = 0, p = 0;
            all.forEach(pl => {
                const s = data[pl.name];
                if (s === 'yes') y++;
                else if (s === 'no') n++;
                else p++;
            });
            document.getElementById('countYes').textContent = y;
            document.getElementById('countNo').textContent = n;
            document.getElementById('countPending').textContent = p;
        }
    </script>
</body>
</html>
